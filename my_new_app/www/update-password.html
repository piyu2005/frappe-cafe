<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Reset Password</title>
</head>
<body>
  <script>
    // Frappe core hardcodes this exact path in the password-reset email
    // (frappe/core/doctype/user/user.py's _reset_password) with no hook to
    // change it, and apps loaded later override an earlier app's same-named
    // www page (see frappe/website/page_renderers/template_page.py, which
    // walks installed_apps in reverse) — so this file, not any config,
    // is what actually intercepts the link. It only forwards the query
    // string (the reset `key`) into the real, styled page in the SPA.
    window.location.replace('/frontend/reset-password' + window.location.search)
  </script>
</body>
</html>
